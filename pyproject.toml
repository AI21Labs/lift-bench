[build-system]
build-backend = "uv_build"
requires = [
  "uv-build>=0.12,<0.13",
]

[project]
name = "lift-bench"
version = "6.6.6"
description = ""
readme = "README.md"
license = "Apache-2.0"
license-files = [
  "LICENSE",
]
authors = [
  { name = "AI21 Research Team" },
]
requires-python = ">=3.12,<3.13"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "dataclasses-json>=0.6.7,<0.7",
  "datasets>=4.8,<6",
  "emoji==2.14.1",
  "inflect>=7.5,<8",
  "langdetect>=1.0.9,<2",
  "langid>=1.1.6,<2",
  "lxml==6.1.3",
  "marko==2.1.3",
  "more-itertools>=10.5,<11",
  "numpy>=2.1,<3",
  "openai>=2.9,<3",
  "pandas>=2.2.3,<3",
  "pydantic",
  "pydantic-settings>=2.14,<3",
  "pyyaml>=6.0.2,<7",
  "ruamel-yaml>=0.19.1,<0.20",
  "scikit-learn>=1.7,<2",
  "tqdm>=4.67.1,<5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m 'not integration'"
markers = [
  "integration: tests that require external services (vLLM server, APIs)",
]

[tool.coverage.run]
branch = true
source = [
  "lift_bench",
  "tests",
]
omit = [
  "tests/fixtures/*",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "def __str__",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "if typing.TYPE_CHECKING:",
]

[tool.coverage.html]
directory = "cov_html"

[tool.coverage.xml]
directory = "coverage.xml"

[tool.mypy]
python_version = "3.12"

[[tool.mypy.overrides]]
module = "lift_bench.hierarchical_drafting.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = [
  "verifiers",
  "verifiers.*",
  "datasets",
  "datasets.*",
]
ignore_missing_imports = true

[dependency-groups]
dev = [
  "deptry",
  "httpx",
  "invoke",
  "ipython",
  "marshmallow",
  "mypy",
  "pre-commit>=4.6,<5",
  "ruff",
]
test = [
  "coverage>=7.13.5,<8",
  "drafting-constraint",
  "drafting-constraint-dummy",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.3.0,<2",
  "pytest-cov>=7.1.0,<8",
  "pytest-mock>=3.15.1,<4",
  "verifiers>=0.4.0,<0.5",
]

[tool.uv]
default-groups = [
  "dev",
  "test",
]

[tool.uv.build-backend]
module-name = "lift_bench"
module-root = ""
source-include = [
  "tests/**",
]

[tool.uv.sources]
drafting-constraint = { workspace = true }
drafting-constraint-dummy = { workspace = true }

[tool.uv.workspace]
members = [
  "environments/drafting_constraint",
  "environments/drafting_constraint_dummy",
]

[tool.commitizen]
name = "cz_customize"

[tool.commitizen.customize]
schema_pattern = "(build|ci|docs|feat!|feat|fix|perf|refactor|style|test|chore|revert|bump):(\\s.*)"
