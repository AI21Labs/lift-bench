# prime-rl training on the paper's "flat + structured" LIFT-Train mixture: five splits, equally weighted, with
# their test splits evaluated on a step interval. Each split is read from the Hub dataset at a pinned commit, so it
# runs from any directory; needs Hub access (HF_TOKEN) while the dataset is private.
#
# The hyperparameters are a small starting point that fits on two GPUs (one inference, one trainer), not the
# paper's recipe; override them on the command line or in a config layered after this one.
max_steps = 100
seq_len = 8192

[model]
name = "Qwen/Qwen3-1.7B"

[trainer.optim]
lr = 1e-6

[inference]

[orchestrator]
batch_size = 32

[orchestrator.train]
group_size = 4

[orchestrator.train.sampling]
max_completion_tokens = 2048

[[orchestrator.train.source]]
name = "short-some"
ratio = 1
env.taskset.id = "drafting_constraint"
env.taskset.dataset_config = "short_doc_some_constraints"
env.taskset.dataset_split = "train"
env.taskset.dataset_revision = "7320d3271387297c14acd32d9584b88dccdd1f01"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

[[orchestrator.train.source]]
name = "short-many"
ratio = 1
env.taskset.id = "drafting_constraint"
env.taskset.dataset_config = "short_doc_many_constraints"
env.taskset.dataset_split = "train"
env.taskset.dataset_revision = "7320d3271387297c14acd32d9584b88dccdd1f01"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

[[orchestrator.train.source]]
name = "long-some"
ratio = 1
env.taskset.id = "drafting_constraint"
env.taskset.dataset_config = "long_doc_some_constraints"
env.taskset.dataset_split = "train"
env.taskset.dataset_revision = "7320d3271387297c14acd32d9584b88dccdd1f01"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

[[orchestrator.train.source]]
name = "long-many"
ratio = 1
env.taskset.id = "drafting_constraint"
env.taskset.dataset_config = "long_doc_many_constraints"
env.taskset.dataset_split = "train"
env.taskset.dataset_revision = "7320d3271387297c14acd32d9584b88dccdd1f01"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

[[orchestrator.train.source]]
name = "flat-some"
ratio = 1
env.taskset.id = "drafting_constraint"
env.taskset.dataset_config = "flat_doc_some_constraints"
env.taskset.dataset_split = "train"
env.taskset.dataset_revision = "7320d3271387297c14acd32d9584b88dccdd1f01"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

# Every judged check of an eval rollout calls the judge too, so each test split is capped rather than evaluated whole.
[orchestrator.eval]
interval = 25

[orchestrator.eval.sampling]
max_completion_tokens = 2048

[[orchestrator.eval.source]]
name = "short-some-test"
select.limit = 8
env.taskset.id = "drafting_constraint"
env.taskset.dataset_config = "short_doc_some_constraints"
env.taskset.dataset_split = "test"
env.taskset.dataset_revision = "7320d3271387297c14acd32d9584b88dccdd1f01"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

[[orchestrator.eval.source]]
name = "short-many-test"
select.limit = 8
env.taskset.id = "drafting_constraint"
env.taskset.dataset_config = "short_doc_many_constraints"
