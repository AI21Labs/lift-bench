# A minimal prime-rl run to layer the mixtures over: a small policy, 5 steps, small batches, no W&B and no eval.
# A smoke test that the taskset, the Hub data and the judge work end to end, not a training recipe. Fits on two
# GPUs, one for inference and one for the trainer.
max_steps = 5
seq_len = 8192

[model]
name = "Qwen/Qwen3-1.7B"

[orchestrator]
batch_size = 32

[orchestrator.train]
group_size = 4

[orchestrator.train.sampling]
max_completion_tokens = 2048

[trainer.optim]
lr = 1e-6

[inference]
