# prime-rl standalone evaluation (`eval`) on the test splits of the paper's "flat + structured" LIFT-Train mixture.
# Each split is read from the Hub dataset at a pinned commit, so it runs from any directory; needs Hub access
# (HF_TOKEN) while the dataset is private. Name the model under test with --model.

[[source]]
name = "short-some"
env.taskset.id = "drafting_constraint"
env.taskset.dataset_config = "short_doc_some_constraints"
env.taskset.dataset_split = "test"
env.taskset.dataset_revision = "7320d3271387297c14acd32d9584b88dccdd1f01"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

