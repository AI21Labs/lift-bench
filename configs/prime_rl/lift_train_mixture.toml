# The paper's "flat + structured" LIFT-Train mixture, as prime-rl training sources: five splits, equally weighted.
# Only the data sources; each reads its split from the Hub dataset at a pinned commit, so it runs from any
# directory. Needs Hub access (HF_TOKEN) while the dataset is private. Has run a 5-step training.

[[orchestrator.train.source]]
name = "short-some"
ratio = 1
env.taskset.id = "drafting_constraint"
env.taskset.dataset_config = "short_doc_some_constraints"
env.taskset.dataset_split = "train"
env.taskset.dataset_revision = "7320d3271387297c14acd32d9584b88dccdd1f01"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

